name: Update Lottery Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Powerball Data
        run: |
          curl -s "https://data.ny.gov/resource/d6yy-54nr.json?\$limit=50000&\$order=draw_date%20DESC" -o /tmp/pb-raw.json
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('/tmp/pb-raw.json', 'utf8'));
            const parsed = raw.map(r => {
              const nums = r.winning_numbers.trim().split(/\s+/).map(Number);
              return { date: r.draw_date.split('T')[0], numbers: nums.slice(0,5).sort((a,b)=>a-b), pb: nums[5], multiplier: Number(r.multiplier)||1 };
            }).filter(d => d.numbers.length===5 && d.pb && new Date(d.date) >= new Date('2015-10-07'));
            fs.writeFileSync('public/data/powerball-history.json', JSON.stringify(parsed));
            console.log('Powerball: ' + parsed.length + ' draws, newest: ' + parsed[0]?.date);
          "

      - name: Fetch Mega Millions Data
        run: |
          curl -s "https://data.ny.gov/resource/5xaw-6ayf.json?\$limit=50000&\$order=draw_date%20DESC" -o /tmp/mm-raw.json
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('/tmp/mm-raw.json', 'utf8'));
            const parsed = raw.map(r => {
              const nums = r.winning_numbers.trim().split(/\s+/).map(Number);
              return { date: r.draw_date.split('T')[0], numbers: nums.sort((a,b)=>a-b), mb: Number(r.mega_ball), multiplier: Number(r.multiplier)||1 };
            }).filter(d => d.numbers.length===5 && d.mb>0 && new Date(d.date) >= new Date('2017-10-28'));
            fs.writeFileSync('public/data/megamillions-history.json', JSON.stringify(parsed));
            console.log('Mega Millions: ' + parsed.length + ' draws, newest: ' + parsed[0]?.date);
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/powerball-history.json public/data/megamillions-history.json
          git stash
          git pull --rebase origin main
          git stash pop
          git add public/data/powerball-history.json public/data/megamillions-history.json
          git commit -m "data: auto-update lottery results $(date +%Y-%m-%d)"
          git push
