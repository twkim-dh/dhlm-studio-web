name: Encoding validation

on:
  push:
    paths:
      - 'src/content/**/*.md'
  pull_request:
    paths:
      - 'src/content/**/*.md'

jobs:
  check-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for mojibake in markdown files
        run: |
          python3 - <<'PYEOF'
          import sys, os, re

          # Detects double-encoded UTF-8 (UTF-8 bytes treated as Latin-1 chars, then re-saved as UTF-8).
          # Pattern: Latin-1 range chars (U+00C2-U+00EF) followed by C1/continuation bytes (U+0080-U+00BF).
          # Covers: box drawing, arrows, math symbols, smart quotes, em/en dash, currency, etc.
          PAT3 = re.compile(r'[\xe0-\xef][\x80-\xbf][\x80-\xbf]')  # 3-byte sequences
          PAT2 = re.compile(r'[\xc2-\xdf][\x80-\xbf]')              # 2-byte sequences

          # Additional heuristic: 5+ consecutive â chars = box drawing line that was corrupted
          PAT_REPEAT = re.compile(r'â{5,}')

          dirs = ['src/content/reports', 'src/content/learn', 'src/content/research', 'src/content/blog']
          errors = []
          scanned = 0

          for d in dirs:
              if not os.path.exists(d):
                  continue
              for f in sorted(os.listdir(d)):
                  if not f.endswith('.md'):
                      continue
                  path = f'{d}/{f}'
                  scanned += 1
                  try:
                      text = open(path, 'r', encoding='utf-8').read()
                  except UnicodeDecodeError as e:
                      errors.append(f'{path}: UTF-8 decode error — {e}')
                      continue

                  for pat, label in [
                      (PAT3, '3-byte mojibake'),
                      (PAT2, '2-byte mojibake'),
                      (PAT_REPEAT, 'repeated-â (box drawing corruption)'),
                  ]:
                      m = pat.search(text)
                      if m:
                          ctx = text[max(0, m.start()-25):m.end()+25].replace('\n', ' ')
                          errors.append(f'{path}: {label} near: ...{ctx}...')
                          break

          print(f'Scanned {scanned} files')
          if errors:
              print(f'\nENCODING ERRORS ({len(errors)} files):')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          else:
              print('OK — all files clean')
          PYEOF
