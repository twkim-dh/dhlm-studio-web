<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5CE1E6"/>
      <stop offset="55%"  stop-color="#86B0F4"/>
      <stop offset="100%" stop-color="#A389F4"/>
    </linearGradient>
    <mask id="m">
      <!-- Outer ring -->
      <circle cx="50" cy="50" r="44" fill="white"/>
      <!-- Inner hole -->
      <circle cx="50" cy="50" r="30" fill="black"/>
      <!-- 4 gap cuts — lines from center at 30°/120°/210°/300° (SVG coords) -->
      <line x1="50" y1="50" x2="75" y2="7"  stroke="black" stroke-width="7"/>
      <line x1="50" y1="50" x2="93" y2="75" stroke="black" stroke-width="7"/>
      <line x1="50" y1="50" x2="25" y2="93" stroke="black" stroke-width="7"/>
      <line x1="50" y1="50" x2="7"  y2="25" stroke="black" stroke-width="7"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="url(#g)" mask="url(#m)"/>
</svg>
